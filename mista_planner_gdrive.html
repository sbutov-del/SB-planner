<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MISTA ERP Planner & Meetings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google API Scripts -->
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CLIENT_ID_KEY = 'mista_gdrive_client_id';
    const FILE_NAME = 'mista_planner_sync.json';
    const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';

    function App() {
      const [activeTab, setActiveTab] = useState('meetings');
      const [clientId, setClientId] = useState(localStorage.getItem(CLIENT_ID_KEY) || '');
      const [isConfigOpen, setIsConfigOpen] = useState(false);
      const [syncStatus, setSyncStatus] = useState('offline'); // offline, ready, syncing, error
      const [lastSync, setLastSync] = useState(null);
      const [tokenClient, setTokenClient] = useState(null);
      const [gapiInited, setGapiInited] = useState(false);

      // Инициализация Google API
      useEffect(() => {
        function gapiLoaded() {
          window.gapi.load('client', async () => {
            await window.gapi.client.init({
              discoveryDocs: [DISCOVERY_DOC],
            });
            setGapiInited(true);
          });
        }
        if (window.gapi) gapiLoaded();
      }, []);

      useEffect(() => {
        if (clientId && window.google) {
          const client = window.google.accounts.oauth2.initTokenClient({
            client_id: clientId,
            scope: SCOPES,
            callback: async (resp) => {
              if (resp.error) {
                setSyncStatus('error');
                return;
              }
              setSyncStatus('ready');
              await syncWithDrive();
            },
          });
          setTokenClient(client);
        }
      }, [clientId]);

      const handleSaveClientId = (id) => {
        const clean = id.trim();
        setClientId(clean);
        localStorage.setItem(CLIENT_ID_KEY, clean);
        setIsConfigOpen(false);
      };

      const handleConnect = () => {
        if (!clientId) {
          setIsConfigOpen(true);
          return;
        }
        if (tokenClient) {
          tokenClient.requestAccessToken({ prompt: 'consent' });
        }
      };

      const syncWithDrive = async () => {
        try {
          setSyncStatus('syncing');
          // Поиск существующего файла
          const res = await window.gapi.client.drive.files.list({
            q: `name = '${FILE_NAME}' and trashed = false`,
            fields: 'files(id, name)',
            spaces: 'drive',
          });
          const files = res.result.files;
          const localData = {
            tasks: localStorage.getItem('mista_tasks') || '[]',
            meetings: localStorage.getItem('mista_meeting_logs') || '[]',
            updatedAt: new Date().toISOString()
          };

          if (files && files.length > 0) {
            const fileId = files[0].id;
            // Обновление существующего
            await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
              method: 'PATCH',
              headers: new Headers({
                'Authorization': 'Bearer ' + window.gapi.client.getToken().access_token,
                'Content-Type': 'application/json'
              }),
              body: JSON.stringify(localData)
            });
          } else {
            // Создание нового файла
            const metadata = { name: FILE_NAME, mimeType: 'application/json' };
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob([JSON.stringify(localData)], { type: 'application/json' }));

            await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
              method: 'POST',
              headers: new Headers({
                'Authorization': 'Bearer ' + window.gapi.client.getToken().access_token
              }),
              body: form
            });
          }
          setSyncStatus('ready');
          setLastSync(new Date().toLocaleTimeString());
        } catch (err) {
          console.error(err);
          setSyncStatus('error');
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/60 backdrop-blur px-6 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-3 h-8 bg-amber-500 rounded-sm"></div>
              <div>
                <h1 className="text-xl font-bold tracking-tight text-white">MISTA <span className="text-slate-400 font-normal">| Производственный Планер</span></h1>
                <div className="text-xs text-slate-500">Система оперативных совещаний и Канбан-учета</div>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {/* Sync Status Button */}
              <button
                onClick={handleConnect}
                className={`px-3 py-1.5 rounded-lg text-xs font-medium border flex items-center gap-2 transition ${
                  syncStatus === 'ready' 
                    ? 'bg-emerald-950/40 border-emerald-500 text-emerald-400' 
                    : syncStatus === 'syncing'
                    ? 'bg-amber-950/40 border-amber-500 text-amber-400 animate-pulse'
                    : 'bg-blue-600 hover:bg-blue-500 text-white border-transparent'
                }`}
              >
                <span>●</span>
                {syncStatus === 'ready' && `Диск готов (${lastSync || 'актуально'})`}
                {syncStatus === 'syncing' && 'Синхронизация...'}
                {syncStatus === 'offline' && 'Подключить Диск'}
                {syncStatus === 'error' && 'Ошибка Диска'}
              </button>

              <button
                onClick={() => setIsConfigOpen(true)}
                className="p-1.5 rounded-lg border border-slate-700 hover:bg-slate-800 text-slate-400"
                title="Настройки ключа"
              >
                ⚙
              </button>
            </div>
          </header>

          {/* Body */}
          <main className="p-8 flex-1 flex flex-col items-center justify-center text-center">
            <div className="max-w-md p-6 bg-slate-900 border border-slate-800 rounded-xl">
              <h2 className="text-lg font-bold mb-2">Рабочая область готова</h2>
              <p className="text-sm text-slate-400 mb-6">
                Нажмите кнопку <strong className="text-blue-400">«Подключить Диск»</strong> в правом верхнем углу, введите свой Client ID и выполните вход в аккаунт Google.
              </p>
              <button 
                onClick={handleConnect}
                className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 font-medium rounded-lg text-sm text-white"
              >
                Подключить Диск
              </button>
            </div>
          </main>

          {/* Modal Client ID */}
          {isConfigOpen && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-lg w-full p-6 text-left">
                <h3 className="text-lg font-bold text-white mb-2">Google Drive Client ID</h3>
                <p className="text-xs text-slate-400 mb-4">
                  Вставьте идентификатор клиента, созданный в Google Cloud Console:
                </p>
                <input
                  type="text"
                  defaultValue={clientId}
                  id="client_id_input"
                  placeholder="xxxxxx.apps.googleusercontent.com"
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 mb-4"
                />
                <div className="flex justify-end gap-3">
                  <button
                    onClick={() => setIsConfigOpen(false)}
                    className="px-4 py-2 rounded-lg text-xs text-slate-400 hover:bg-slate-800"
                  >
                    Отмена
                  </button>
                  <button
                    onClick={() => handleSaveClientId(document.getElementById('client_id_input').value)}
                    className="px-4 py-2 rounded-lg text-xs bg-blue-600 hover:bg-blue-500 text-white font-medium"
                  >
                    Сохранить
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
