<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MISTA ERP Planner & Meetings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>
  <style>
    body { background-color: #0b1120; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    input, select, textarea { font-size: 16px !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CLIENT_ID_KEY = 'mista_gdrive_client_id';
    const FILE_NAME = 'mista_planner_sync.json';
    const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';

    const INITIAL_DEPARTMENTS = [
      { id: 'prod', name: 'Производство' },
      { id: 'mech', name: 'Мехобработка' },
      { id: 'assembly', name: 'Сборка / Монтаж' },
      { id: 'procurement', name: 'Снабжение' },
      { id: 'design', name: 'Конструкторский отдел' }
    ];

    const INITIAL_DATA = {
      departments: INITIAL_DEPARTMENTS,
      meetings: [
        { id: 'm1', date: new Date().toISOString().split('T')[0], title: 'Оперативное производственное совещание', notes: 'Контроль графиков сборки и закрытие дефицитов по комплектующим.' }
      ],
      tasks: [
        { id: 't1', deptId: 'prod', title: 'Контроль сборки узлов шасси', status: 'in_progress', priority: 'high', assignee: 'Марцин', deadline: '' },
        { id: 't2', deptId: 'procurement', title: 'Заказ металлопроката и крепежа', status: 'todo', priority: 'urgent', assignee: 'Олексий', deadline: '' },
        { id: 't3', deptId: 'assembly', title: 'Тестирование электрожгутов', status: 'done', priority: 'medium', assignee: 'Сергей', deadline: '' }
      ]
    };

    function App() {
      const [activeTab, setActiveTab] = useState('kanban');
      const [data, setData] = useState(() => {
        const local = localStorage.getItem('mista_planner_data');
        return local ? JSON.parse(local) : INITIAL_DATA;
      });

      const [selectedDept, setSelectedDept] = useState('all');
      const [clientId, setClientId] = useState(localStorage.getItem(CLIENT_ID_KEY) || '663742247956-dt56qqvgg0re4nki0ficg8ifj6qr4i1e.apps.googleusercontent.com');
      const [isConfigOpen, setIsConfigOpen] = useState(false);
      const [syncStatus, setSyncStatus] = useState('offline');
      const [lastSync, setLastSync] = useState(null);
      const [tokenClient, setTokenClient] = useState(null);
      const [fileId, setFileId] = useState(null);

      const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
      const [isMeetingModalOpen, setIsMeetingModalOpen] = useState(false);
      const [newTask, setNewTask] = useState({ title: '', deptId: 'prod', priority: 'medium', assignee: '', status: 'todo' });
      const [newMeeting, setNewMeeting] = useState({ title: '', date: new Date().toISOString().split('T')[0], notes: '' });

      useEffect(() => {
        localStorage.setItem('mista_planner_data', JSON.stringify(data));
      }, [data]);

      useEffect(() => {
        function gapiLoaded() {
          window.gapi.load('client', async () => {
            try {
              await window.gapi.client.init({ discoveryDocs: [DISCOVERY_DOC] });
            } catch (e) {
              console.error('GAPI Init error:', e);
            }
          });
        }
        if (window.gapi) gapiLoaded();
      }, []);

      useEffect(() => {
        if (clientId && window.google) {
          try {
            const client = window.google.accounts.oauth2.initTokenClient({
              client_id: clientId,
              scope: SCOPES,
              callback: async (resp) => {
                if (resp.error) {
                  setSyncStatus('error');
                  return;
                }
                setSyncStatus('syncing');
                await initDriveSync();
              }
            });
            setTokenClient(client);
          } catch (e) {
            console.error('GIS Init error:', e);
          }
        }
      }, [clientId]);

      const handleConnect = () => {
        if (!clientId) {
          setIsConfigOpen(true);
          return;
        }
        if (tokenClient) {
          tokenClient.requestAccessToken({ prompt: '' });
        }
      };

      const initDriveSync = async () => {
        try {
          const res = await window.gapi.client.drive.files.list({
            q: `name = '${FILE_NAME}' and trashed = false`,
            fields: 'files(id, name)'
          });
          const files = res.result.files;
          if (files && files.length > 0) {
            const fId = files[0].id;
            setFileId(fId);
            const content = await window.gapi.client.drive.files.get({
              fileId: fId,
              alt: 'media'
            });
            if (content.result && content.result.tasks) {
              setData(content.result);
            }
          } else {
            const createRes = await window.gapi.client.request({
              path: '/upload/drive/v3/files',
              method: 'POST',
              params: { uploadType: 'multipart' },
              headers: { 'Content-Type': 'multipart/related; boundary=boundary_mista' },
              body: `--boundary_mista\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: FILE_NAME, mimeType: 'application/json' })}\r\n--boundary_mista\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(data)}\r\n--boundary_mista--`
            });
            setFileId(createRes.result.id);
          }
          const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          setLastSync(time);
          setSyncStatus('ready');
        } catch (e) {
          console.error('Sync error:', e);
          setSyncStatus('ready');
        }
      };

      const syncToDrive = async (updatedData) => {
        if (!fileId || syncStatus !== 'ready') return;
        setSyncStatus('syncing');
        try {
          await window.gapi.client.request({
            path: `/upload/drive/v3/files/${fileId}`,
            method: 'PATCH',
            params: { uploadType: 'media' },
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedData)
          });
          setLastSync(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
          setSyncStatus('ready');
        } catch (e) {
          console.error('Upload error:', e);
          setSyncStatus('ready');
        }
      };

      const updateTaskStatus = (taskId, newStatus) => {
        const next = {
          ...data,
          tasks: data.tasks.map(t => t.id === taskId ? { ...t, status: newStatus } : t)
        };
        setData(next);
        syncToDrive(next);
      };

      const deleteTask = (taskId) => {
        const next = {
          ...data,
          tasks: data.tasks.filter(t => t.id !== taskId)
        };
        setData(next);
        syncToDrive(next);
      };

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTask.title.trim()) return;
        const task = { ...newTask, id: 't_' + Date.now() };
        const next = { ...data, tasks: [...data.tasks, task] };
        setData(next);
        syncToDrive(next);
        setNewTask({ title: '', deptId: data.departments[0]?.id || 'prod', priority: 'medium', assignee: '', status: 'todo' });
        setIsTaskModalOpen(false);
      };

      const handleAddMeeting = (e) => {
        e.preventDefault();
        if (!newMeeting.title.trim()) return;
        const meeting = { ...newMeeting, id: 'm_' + Date.now() };
        const next = { ...data, meetings: [meeting, ...data.meetings] };
        setData(next);
        syncToDrive(next);
        setNewMeeting({ title: '', date: new Date().toISOString().split('T')[0], notes: '' });
        setIsMeetingModalOpen(false);
      };

      const filteredTasks = selectedDept === 'all' 
        ? data.tasks 
        : data.tasks.filter(t => t.deptId === selectedDept);

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur px-6 py-3 flex items-center justify-between sticky top-0 z-20">
            <div className="flex items-center gap-6">
              <div className="flex items-center gap-3">
                <div className="w-2.5 h-7 bg-amber-500 rounded-sm"></div>
                <div>
                  <h1 className="text-lg font-bold tracking-tight text-white leading-tight">MISTA <span className="text-slate-400 font-normal">| Производственный Планер</span></h1>
                  <div className="text-xs text-slate-500">Система оперативных совещаний и Канбан-учета</div>
                </div>
              </div>

              <nav className="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
                <button 
                  onClick={() => setActiveTab('kanban')}
                  className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${activeTab === 'kanban' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                  Канбан-доска
                </button>
                <button 
                  onClick={() => setActiveTab('meetings')}
                  className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${activeTab === 'meetings' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                  Совещания
                </button>
              </nav>
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={handleConnect}
                className={`px-3 py-1.5 rounded-lg text-xs font-medium border flex items-center gap-2 transition ${
                  syncStatus === 'ready'
                    ? 'bg-emerald-950/40 border-emerald-500 text-emerald-400'
                    : syncStatus === 'syncing'
                    ? 'bg-amber-950/40 border-amber-500 text-amber-400 animate-pulse'
                    : 'bg-blue-600 hover:bg-blue-500 text-white border-transparent'
                }`}
              >
                <span className={`w-2 h-2 rounded-full ${syncStatus === 'ready' ? 'bg-emerald-400' : 'bg-white'}`}></span>
                {syncStatus === 'ready' && `Диск готов (${lastSync || 'актуально'})`}
                {syncStatus === 'syncing' && 'Синхронизация...'}
                {syncStatus === 'offline' && 'Подключить Диск'}
                {syncStatus === 'error' && 'Ошибка Диска'}
              </button>

              <button
                onClick={() => setIsConfigOpen(true)}
                className="p-1.5 rounded-lg border border-slate-700 hover:bg-slate-800 text-slate-400"
                title="Настройки ключа"
              >
                ⚙
              </button>
            </div>
          </header>

          <div className="px-6 py-3 border-b border-slate-800 bg-slate-900/40 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="text-xs text-slate-400">Отдел:</span>
              <select 
                value={selectedDept} 
                onChange={(e) => setSelectedDept(e.target.value)}
                className="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-slate-200 outline-none focus:border-blue-500"
              >
                <option value="all">Все отделы</option>
                {data.departments.map(d => (
                  <option key={d.id} value={d.id}>{d.name}</option>
                ))}
              </select>
            </div>

            {activeTab === 'kanban' ? (
              <button 
                onClick={() => setIsTaskModalOpen(true)}
                className="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1.5"
              >
                + Добавить задачу
              </button>
            ) : (
              <button 
                onClick={() => setIsMeetingModalOpen(true)}
                className="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1.5"
              >
                + Протокол совещания
              </button>
            )}
          </div>

          <main className="p-6 flex-1 overflow-auto">
            {activeTab === 'kanban' ? (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex flex-col">
                  <div className="flex items-center justify-between mb-4">
                    <span className="text-sm font-semibold text-slate-300">К выполнению</span>
                    <span className="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">
                      {filteredTasks.filter(t => t.status === 'todo').length}
                    </span>
                  </div>
                  <div className="space-y-3 flex-1 overflow-y-auto">
                    {filteredTasks.filter(t => t.status === 'todo').map(task => (
                      <TaskCard key={task.id} task={task} departments={data.departments} onStatusChange={updateTaskStatus} onDelete={deleteTask} />
                    ))}
                  </div>
                </div>

                <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex flex-col">
                  <div className="flex items-center justify-between mb-4">
                    <span className="text-sm font-semibold text-amber-400">В работе</span>
                    <span className="text-xs bg-amber-950/60 border border-amber-800 text-amber-400 px-2 py-0.5 rounded-full">
                      {filteredTasks.filter(t => t.status === 'in_progress').length}
                    </span>
                  </div>
                  <div className="space-y-3 flex-1 overflow-y-auto">
                    {filteredTasks.filter(t => t.status === 'in_progress').map(task => (
                      <TaskCard key={task.id} task={task} departments={data.departments} onStatusChange={updateTaskStatus} onDelete={deleteTask} />
                    ))}
                  </div>
                </div>

                <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex flex-col">
                  <div className="flex items-center justify-between mb-4">
                    <span className="text-sm font-semibold text-emerald-400">Готово</span>
                    <span className="text-xs bg-emerald-950/60 border border-emerald-800 text-emerald-400 px-2 py-0.5 rounded-full">
                      {filteredTasks.filter(t => t.status === 'done').length}
                    </span>
                  </div>
                  <div className="space-y-3 flex-1 overflow-y-auto">
                    {filteredTasks.filter(t => t.status === 'done').map(task => (
                      <TaskCard key={task.id} task={task} departments={data.departments} onStatusChange={updateTaskStatus} onDelete={deleteTask} />
                    ))}
                  </div>
                </div>
              </div>
            ) : (
              <div className="max-w-4xl mx-auto space-y-4">
                {data.meetings.map(m => (
                  <div key={m.id} className="bg-slate-900 border border-slate-800 rounded-xl p-5">
                    <div className="flex items-center justify-between mb-2">
                      <h3 className="font-semibold text-white text-base">{m.title}</h3>
                      <span className="text-xs text-slate-500 font-mono">{m.date}</span>
                    </div>
                    <p className="text-sm text-slate-300 whitespace-pre-wrap">{m.notes}</p>
                  </div>
                ))}
              </div>
            )}
          </main>

          {isTaskModalOpen && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleAddTask} className="bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full p-6 text-left">
                <h3 className="text-base font-bold text-white mb-4">Новая задача</h3>
                <div className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Название / Содержание</label>
                    <input 
                      type="text" 
                      required 
                      value={newTask.title} 
                      onChange={e => setNewTask({...newTask, title: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-200 outline-none focus:border-blue-500" 
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Отдел</label>
                      <select 
                        value={newTask.deptId} 
                        onChange={e => setNewTask({...newTask, deptId: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-200 outline-none"
                      >
                        {data.departments.map(d => (
                          <option key={d.id} value={d.id}>{d.name}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Приоритет</label>
                      <select 
                        value={newTask.priority} 
                        onChange={e => setNewTask({...newTask, priority: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-200 outline-none"
                      >
                        <option value="low">Низкий</option>
                        <option value="medium">Средний</option>
                        <option value="high">Высокий</option>
                        <option value="urgent">Срочно</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Ответственный</label>
                    <input 
                      type="text" 
                      value={newTask.assignee} 
                      onChange={e => setNewTask({...newTask, assignee: e.target.value})}
                      placeholder="Имя / Фамилия"
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-200 outline-none focus:border-blue-500" 
                    />
                  </div>
                </div>
                <div className="flex justify-end gap-3 mt-6">
                  <button type="button" onClick={() => setIsTaskModalOpen(false)} className="px-4 py-2 rounded-lg text-xs text-slate-400 hover:bg-slate-800">Отмена</button>
                  <button type="submit" className="px-4 py-2 rounded-lg text-xs bg-blue-600 hover:bg-blue-500 text-white font-medium">Создать</button>
                </div>
              </form>
            </div>
          )}

          {isMeetingModalOpen && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleAddMeeting} className="bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full p-6 text-left">
                <h3 className="text-base font-bold text-white mb-4">Протокол оперативного совещания</h3>
                <div className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Тема</label>
                    <input 
                      type="text" 
                      required 
                      value={newMeeting.title} 
                      onChange={e => setNewMeeting({...newMeeting, title: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-200 outline-none focus:border-blue-500" 
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Дата</label>
                    <input 
                      type="date" 
                      required 
                      value={newMeeting.date} 
                      onChange={e => setNewMeeting({...newMeeting, date: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-200 outline-none" 
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Решения и поручения</label>
                    <textarea 
                      rows="4" 
                      value={newMeeting.notes} 
                      onChange={e => setNewMeeting({...newMeeting, notes: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-200 outline-none focus:border-blue-500"
                    ></textarea>
                  </div>
                </div>
                <div className="flex justify-end gap-3 mt-6">
                  <button type="button" onClick={() => setIsMeetingModalOpen(false)} className="px-4 py-2 rounded-lg text-xs text-slate-400 hover:bg-slate-800">Отмена</button>
                  <button type="submit" className="px-4 py-2 rounded-lg text-xs bg-blue-600 hover:bg-blue-500 text-white font-medium">Сохранить</button>
                </div>
              </form>
            </div>
          )}

          {isConfigOpen && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-lg w-full p-6 text-left">
                <h3 className="text-base font-bold text-white mb-2">Google Drive Client ID</h3>
                <p className="text-xs text-slate-400 mb-4">Идентификатор клиента для синхронизации с вашим Google Диском:</p>
                <input 
                  type="text" 
                  defaultValue={clientId}
                  id="client_id_field"
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 outline-none mb-4 font-mono"
                />
                <div className="flex justify-end gap-3">
                  <button onClick={() => setIsConfigOpen(false)} className="px-4 py-2 rounded-lg text-xs text-slate-400 hover:bg-slate-800">Закрыть</button>
                  <button 
                    onClick={() => {
                      const val = document.getElementById('client_id_field').value.trim();
                      setClientId(val);
                      localStorage.setItem(CLIENT_ID_KEY, val);
                      setIsConfigOpen(false);
                    }}
                    className="px-4 py-2 rounded-lg text-xs bg-blue-600 hover:bg-blue-500 text-white font-medium"
                  >
                    Сохранить
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function TaskCard({ task, departments, onStatusChange, onDelete }) {
      const dept = departments.find(d => d.id === task.deptId)?.name || 'Общий';
      const priorityColors = {
        urgent: 'border-l-rose-500 bg-rose-950/20',
        high: 'border-l-amber-500 bg-amber-950/20',
        medium: 'border-l-blue-500 bg-slate-950/60',
        low: 'border-l-slate-600 bg-slate-950/40'
      };

      return (
        <div className={`p-3.5 rounded-lg border border-slate-800/80 border-l-4 ${priorityColors[task.priority] || priorityColors.medium} flex flex-col gap-2.5`}>
          <div className="flex items-start justify-between gap-2">
            <span className="text-xs font-medium text-slate-100 leading-snug">{task.title}</span>
            <button onClick={() => onDelete(task.id)} className="text-slate-600 hover:text-rose-400 text-xs px-1">✕</button>
          </div>
          
          <div className="flex items-center justify-between text-[11px] text-slate-400 pt-1 border-t border-slate-800/50">
            <span className="bg-slate-800/80 px-2 py-0.5 rounded text-slate-300">{dept}</span>
            {task.assignee && <span className="font-medium text-slate-300">👤 {task.assignee}</span>}
          </div>

          <div className="flex items-center justify-end gap-1 pt-1">
            {task.status !== 'todo' && (
              <button onClick={() => onStatusChange(task.id, 'todo')} className="text-[10px] text-slate-400 hover:text-white px-1.5 py-0.5 bg-slate-800 rounded">К выполнению</button>
            )}
            {task.status !== 'in_progress' && (
              <button onClick={() => onStatusChange(task.id, 'in_progress')} className="text-[10px] text-amber-400 hover:text-amber-300 px-1.5 py-0.5 bg-slate-800 rounded">В работу</button>
            )}
            {task.status !== 'done' && (
              <button onClick={() => onStatusChange(task.id, 'done')} className="text-[10px] text-emerald-400 hover:text-emerald-300 px-1.5 py-0.5 bg-slate-800 rounded">Готово</button>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
